x-nest-base: &nest-base
  restart: unless-stopped
  networks:
    - backend_net
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp

services:
  api:
    <<: *nest-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: core-app
    container_name: ${COMPOSE_PROJECT_NAME:-quickbite}_api
    ports:
      - "127.0.0.1:3007:3007"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-app_admin}:${POSTGRES_PASSWORD:-REPLACE_WITH_STRONG_GENERATED_PASSWORD}@postgres:5432/${POSTGRES_DB:-app_production}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-REPLACE_WITH_ANOTHER_STRONG_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD:-REPLACE_WITH_ANOTHER_STRONG_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-quickbite-super-secret-key-change-in-production}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3007/api || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

