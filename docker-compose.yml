name: ${COMPOSE_PROJECT_NAME:-quickbite}

x-nest-base: &nest-base
  restart: unless-stopped
  networks:
    - backend_net
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp

services:
  api:
    <<: *nest-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: core-app
    container_name: ${COMPOSE_PROJECT_NAME:-quickbite}_api
    ports:
      - "${HOST_PORT:-127.0.0.1:3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://app_admin:REPLACE_WITH_STRONG_GENERATED_PASSWORD@postgres:5432/app_production?schema=public}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-}
      JWT_SECRET: ${JWT_SECRET:-quickbite-super-secret-key-change-in-production}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Additional microservices (e.g. worker, admin) can be enabled once created in apps/
  # worker:
  #   <<: *nest-base
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     args:
  #       APP_NAME: worker
  #   container_name: ${COMPOSE_PROJECT_NAME:-quickbite}_worker
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #     REDIS_HOST: ${REDIS_HOST:-redis}
  #     REDIS_PORT: ${REDIS_PORT:-6379}
  #     REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  #     JWT_SECRET: ${JWT_SECRET:-quickbite-super-secret-key-change-in-production}

networks:
  backend_net:
    external: true
    name: ${NETWORK_NAME:-quickbite_network}
